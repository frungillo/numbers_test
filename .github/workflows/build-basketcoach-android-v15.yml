name: Build Basket Coach Studio Android v15

on:
  push:
    branches:
      - basket-coach-studio-android-v15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore project
        run: |
          mkdir buildproj
          base64 -d basketcoach_project.zip.b64 > project.zip
          unzip -q project.zip -d buildproj

      - name: Build debug APK
        working-directory: buildproj
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BasketCoachStudio-Android-v15
          path: buildproj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
